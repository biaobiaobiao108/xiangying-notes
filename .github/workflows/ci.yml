name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Go application
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        shell: pwsh
        run: |
          $unformatted = gofmt -l .
          if ($unformatted) {
            Write-Error "Unformatted Go files:`n$($unformatted -join "`n")"
            exit 1
          }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Build desktop application
        run: go build -ldflags "-H=windowsgui" -o xiangying.exe .

      - name: Verify build artifact
        shell: pwsh
        run: |
          if (-not (Test-Path xiangying.exe)) {
            throw "xiangying.exe was not produced"
          }
          Get-Item xiangying.exe | Format-List Name, Length
