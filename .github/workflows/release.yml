name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows amd64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build application
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o dist/xiangying.exe .

      - name: Package application
        shell: pwsh
        run: |
          $archive = "xiangying-$env:GITHUB_REF_NAME-windows-amd64.zip"
          Compress-Archive -Path dist/xiangying.exe -DestinationPath $archive
          Get-Item $archive | Format-List Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiangying-${{ github.ref_name }}-windows-amd64
          path: xiangying-${{ github.ref_name }}-windows-amd64.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS arm64
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build application bundle
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail

          APP="dist/Xiangying.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          go build -trimpath -ldflags "-s -w" -o "$APP/Contents/MacOS/Xiangying" .

          ICONSET="dist/AppIcon.iconset"
          mkdir -p "$ICONSET"
          MASTER="dist/icon-1024.png"
          sips -z 1024 1024 assets/icon.png --out "$MASTER" >/dev/null

          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" "$MASTER" --out "$ICONSET/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" "$MASTER" --out "$ICONSET/icon_${size}x${size}@2x.png" >/dev/null
          done

          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"

          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION%%-*}"

          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>象映笔记</string>
            <key>CFBundleDisplayName</key>
            <string>象映笔记</string>
            <key>CFBundleExecutable</key>
            <string>Xiangying</string>
            <key>CFBundleIdentifier</key>
            <string>com.biaobiaobiao108.xiangying</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${GITHUB_RUN_NUMBER}</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>LSApplicationCategoryType</key>
            <string>public.app-category.productivity</string>
          </dict>
          </plist>
          EOF

          xattr -cr "$APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          file "$APP/Contents/MacOS/Xiangying"

          ARCHIVE="xiangying-${GITHUB_REF_NAME}-macos-arm64.zip"
          ditto -c -k --keepParent "$APP" "$ARCHIVE"
          ls -lh "$ARCHIVE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiangying-${{ github.ref_name }}-macos-arm64
          path: xiangying-${{ github.ref_name }}-macos-arm64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - build-windows
      - build-macos
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums and release notes
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum *.zip > SHA256SUMS.txt

          cat > ../release-notes.md <<EOF
          ## 下载

          - **Windows x64**：\`xiangying-${GITHUB_REF_NAME}-windows-amd64.zip\`，解压后直接运行 \`xiangying.exe\`，无需安装。
          - **macOS Apple Silicon**：\`xiangying-${GITHUB_REF_NAME}-macos-arm64.zip\`，适用于 macOS 11 及以上版本。

          ## macOS 说明

          应用使用 ad-hoc 签名，尚未经过 Apple 公证。首次打开时如被系统拦截，请在 Finder 中右键点击应用并选择「打开」，或前往「系统设置 → 隐私与安全性」允许运行。

          ## 校验

          下载 \`SHA256SUMS.txt\` 可校验安装包完整性。
          EOF

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/*.zip \
            release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "象映笔记 $GITHUB_REF_NAME" \
            --notes-file release-notes.md
