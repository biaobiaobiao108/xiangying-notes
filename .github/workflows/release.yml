name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows amd64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v") -replace "-.*$", ""
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"

      - name: Build application
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o dist/xiangying.exe .

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --version=3.13 --yes --no-progress

      - name: Build installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          makensis "/DAPP_VERSION=$env:APP_VERSION" scripts/installer-windows.nsi

      - name: Build portable package
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $archive = "dist\xiangying-$env:APP_VERSION-windows-amd64.zip"
          Compress-Archive -Path dist/xiangying.exe -DestinationPath $archive

      - name: Verify packages
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $files = @(
            "dist\xiangying-$env:APP_VERSION-windows-amd64-setup.exe",
            "dist\xiangying-$env:APP_VERSION-windows-amd64.zip"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "Missing package: $file"
            }
          }
          Get-Item $files | Format-List Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiangying-${{ github.ref_name }}-windows-amd64
          path: |
            dist/xiangying-${{ steps.version.outputs.version }}-windows-amd64-setup.exe
            dist/xiangying-${{ steps.version.outputs.version }}-windows-amd64.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS arm64
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Determine version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version%%-*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build application bundle
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "0"
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          APP="dist/Xiangying.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          go build -trimpath -ldflags "-s -w" -o "$APP/Contents/MacOS/Xiangying" .

          ICONSET="dist/AppIcon.iconset"
          mkdir -p "$ICONSET"
          MASTER="dist/icon-1024.png"
          sips -z 1024 1024 assets/icon.png --out "$MASTER" >/dev/null

          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" "$MASTER" --out "$ICONSET/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" "$MASTER" --out "$ICONSET/icon_${size}x${size}@2x.png" >/dev/null
          done

          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"

          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>象映笔记</string>
            <key>CFBundleDisplayName</key>
            <string>象映笔记</string>
            <key>CFBundleExecutable</key>
            <string>Xiangying</string>
            <key>CFBundleIdentifier</key>
            <string>com.biaobiaobiao108.xiangying</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${APP_VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${GITHUB_RUN_NUMBER}</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>LSApplicationCategoryType</key>
            <string>public.app-category.productivity</string>
          </dict>
          </plist>
          EOF

          xattr -cr "$APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          file "$APP/Contents/MacOS/Xiangying"

          ARCHIVE="xiangying-${APP_VERSION}-macos-arm64.zip"
          ditto -c -k --keepParent "$APP" "$ARCHIVE"

          STAGE="dist/dmg"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"

          DMG="xiangying-${APP_VERSION}-macos-arm64.dmg"
          hdiutil create -volname "象映笔记" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          hdiutil verify "$DMG"

          ls -lh "$ARCHIVE" "$DMG"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiangying-${{ github.ref_name }}-macos-arm64
          path: |
            xiangying-${{ steps.version.outputs.version }}-macos-arm64.dmg
            xiangying-${{ steps.version.outputs.version }}-macos-arm64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - build-windows
      - build-macos
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums and release notes
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          version="${version%%-*}"

          cd release-assets
          sha256sum *.exe *.dmg *.zip > SHA256SUMS.txt

          cat > ../release-notes.md <<EOF
          ## 下载

          - **Windows x64 安装程序**：\`xiangying-${version}-windows-amd64-setup.exe\`。按向导安装到当前用户目录，无需管理员权限。
          - **Windows x64 便携版**：\`xiangying-${version}-windows-amd64.zip\`。解压后直接运行，无需安装。
          - **macOS Apple Silicon 安装镜像**：\`xiangying-${version}-macos-arm64.dmg\`。打开后将「象映笔记」拖入「应用程序」。
          - **macOS Apple Silicon 便携版**：\`xiangying-${version}-macos-arm64.zip\`。

          ## 系统要求

          - Windows 10 及以上，x64。
          - macOS 11 及以上，Apple Silicon（M 系列芯片）。

          ## 安装说明

          Windows 安装程序会安装到当前用户目录，并创建开始菜单快捷方式；桌面快捷方式可在安装时选择。卸载程序不会删除本地笔记数据。

          macOS 安装镜像中已将应用与「应用程序」文件夹放在一起，拖动应用即可完成安装。

          ## 签名说明

          当前发布包未使用商业代码签名证书。Windows SmartScreen 可能提示未知发布者；macOS 应用使用 ad-hoc 签名且未经过 Apple 公证，首次打开时如被拦截，请在 Finder 中右键点击应用并选择「打开」，或前往「系统设置 → 隐私与安全性」允许运行。

          ## 校验

          下载 \`SHA256SUMS.txt\` 可校验安装包完整性。
          EOF

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/*.exe \
            release-assets/*.dmg \
            release-assets/*.zip \
            release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "象映笔记 $GITHUB_REF_NAME" \
            --notes-file release-notes.md
